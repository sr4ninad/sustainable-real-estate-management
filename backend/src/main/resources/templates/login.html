<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Admin console</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: Poppins, system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: linear-gradient(135deg, #0f2a1d, #1e293b); }
    .box { width: min(380px, calc(100vw - 32px)); background: white; border-radius: 14px; padding: 28px; box-sizing: border-box;
           box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { margin: 0 0 18px; color: #64748b; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 500; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cbd5e1; border-radius: 7px; font: inherit; }
    button { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 7px; background: #15803d; color: white;
             font: 600 14px Poppins, sans-serif; cursor: pointer; }
    .msg { padding: 10px 12px; border-radius: 7px; font-size: 13px; margin-bottom: 12px; }
    .err { background: #fee2e2; color: #991b1b; }
    .ok { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>
<form class="box" th:action="@{/login}" method="post">
  <h1>Admin console</h1>
  <p>Sign in with an administrator account.</p>

  <div class="msg err" th:if="${param.error}">Invalid username or password.</div>
  <div class="msg err" th:if="${param.denied}">That account isn't an administrator.</div>
  <div class="msg ok" th:if="${param.logout}">You've been signed out.</div>

  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" autofocus required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
