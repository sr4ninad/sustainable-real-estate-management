# Local secrets live in backend/db.properties (git-ignored). See db.properties.example.
# Environment variables with the same names (DB_URL, DB_USERNAME, DB_PASSWORD, ...) override them.
spring.config.import=optional:file:./db.properties,optional:file:./backend/db.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sustainable_real_estate}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# database/schema.sql is the source of truth: Hibernate never alters the schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Include exception messages in error responses so the UI can explain failures
# (e.g. the trg_check_sustainability trigger blocking a sale).
server.error.include-message=always

# Admin console forms post dates as yyyy-MM-dd.
spring.mvc.format.date=iso

# Session cookie shared by the React app (through the Vite proxy) and the admin console.
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# Accounts created on startup when missing. Change these in db.properties.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
# Creates a login for every agent and client that doesn't have one yet (demo convenience).
app.demo-users.enabled=${DEMO_USERS:true}
app.demo-users.agent-password=${DEMO_AGENT_PASSWORD:agent123}
app.demo-users.client-password=${DEMO_CLIENT_PASSWORD:client123}

# Where the React app runs (CORS for direct, non-proxied calls).
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
